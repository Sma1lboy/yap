<!doctype html>
<!-- Sign-in code email (paygate auth.ts). Placeholders: {{productName}}, {{code}}, {{minutes}}.
     Send with the existing plain-text body as the text part. Table layout, inline styles only, 600px wide, no
     images (many clients block them), no dark-mode CSS: a fixed light palette whose yellow is only ever a fill,
     so a client that force-inverts it stays readable. Hex values are the light column of docs/DESIGN.md. -->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{productName}} 登录验证码</title>
</head>
<body style="margin:0;padding:0;background:#F3F3F5;">
<div style="display:none;max-height:0;overflow:hidden;">你的登录验证码是 {{code}}，{{minutes}} 分钟内有效。</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#F3F3F5;">
<tr><td align="center" style="padding:32px 12px;">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;background:#FFFFFF;border:1px solid #DCDCE1;border-radius:12px;">
<tr><td style="padding:28px 32px 0 32px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Helvetica Neue',Arial,sans-serif;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
    <td width="18" height="18" style="width:18px;height:18px;background:#FFD84D;border-radius:5px;font-size:0;line-height:0;">&nbsp;</td>
    <td style="padding-left:8px;font-size:15px;font-weight:600;color:#1F1F23;">{{productName}} Cloud</td>
  </tr></table>
</td></tr>
<tr><td style="padding:28px 32px 0 32px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Helvetica Neue',Arial,sans-serif;font-size:16px;line-height:24px;color:#1F1F23;">
  你的登录验证码（{{minutes}} 分钟内有效）：
</td></tr>
<tr><td style="padding:12px 32px 0 32px;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
    <td style="background:#EAEAED;border-radius:8px;padding:12px 18px;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:30px;line-height:36px;font-weight:600;letter-spacing:6px;color:#1F1F23;">{{code}}</td>
  </tr></table>
</td></tr>
<tr><td style="padding:16px 32px 28px 32px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Helvetica Neue',Arial,sans-serif;font-size:14px;line-height:22px;color:#5E5E66;">
  在 {{productName}} 里输入这 6 位数字即可登录。如果不是你本人操作，忽略这封邮件就好，账户不会有任何变化。
</td></tr>
<tr><td style="padding:14px 32px;border-top:1px solid #DCDCE1;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Helvetica Neue',Arial,sans-serif;font-size:12px;line-height:18px;color:#6F6F77;">
  {{productName}} Cloud · 这封邮件由系统自动发送，请勿回复
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
