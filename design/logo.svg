<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#FFD35C"/>
      <stop offset="1" stop-color="#FF9A3D"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF1DE"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#6B3A00" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#B35A00" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- 图标底座：macOS 规范 824×824，内缩 100 -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- 顶部高光 -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#gloss)"/>

  <!-- 主角：对话气泡小家伙 -->
  <g filter="url(#soft)">
    <path d="M300 560 C300 420 400 330 512 330 C624 330 724 420 724 560 C724 690 630 770 512 770 C470 770 432 762 400 746 L318 790 C306 796 294 784 300 771 L330 700 C310 660 300 612 300 560 Z" fill="url(#body)"/>
  </g>

  <!-- 眼睛 -->
  <ellipse cx="440" cy="540" rx="28" ry="34" fill="#3B2A20"/>
  <ellipse cx="584" cy="540" rx="28" ry="34" fill="#3B2A20"/>
  <circle cx="450" cy="526" r="10" fill="#FFFFFF"/>
  <circle cx="594" cy="526" r="10" fill="#FFFFFF"/>

  <!-- 腮红 -->
  <ellipse cx="392" cy="610" rx="36" ry="22" fill="#FF8FA3" opacity="0.75"/>
  <ellipse cx="632" cy="610" rx="36" ry="22" fill="#FF8FA3" opacity="0.75"/>

  <!-- 张嘴说话 -->
  <path d="M470 612 Q512 604 554 612 Q550 676 512 680 Q474 676 470 612 Z" fill="#3B2A20"/>
  <path d="M488 656 Q512 640 536 656 Q526 676 512 677 Q498 676 488 656 Z" fill="#FF6F7F"/>

  <!-- 说话的声波 -->
  <path d="M760 470 Q792 520 760 570" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" opacity="0.9"/>
  <path d="M808 430 Q858 520 808 610" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" opacity="0.6"/>

  <!-- 中英小气泡 -->
  <g filter="url(#soft)">
    <circle cx="270" cy="300" r="74" fill="#FFFFFF"/>
    <path d="M222 350 L206 392 L252 368 Z" fill="#FFFFFF"/>
    <circle cx="700" cy="232" r="62" fill="#3B2A20"/>
    <path d="M740 276 L766 306 L728 290 Z" fill="#3B2A20"/>
  </g>
  <text x="270" y="327" text-anchor="middle" font-family="Arial Rounded MT Bold, Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="80" fill="#FF8A2A">A</text>
  <text x="700" y="256" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-weight="600" font-size="66" fill="#FFD35C">中</text>
</svg>
