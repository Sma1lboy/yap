name: Build Yap

# 推 v* tag 发 Release；手动触发只产出 artifact
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      # mlx-swift 要编译 Metal shader，Xcode 26 默认不带这个组件
      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Cache whisper.cpp framework
        uses: actions/cache@v4
        with:
          path: ~/VoiceInk-Dependencies
          key: whisper-${{ runner.os }}-xcode26.6-v1

      - name: Build (LOCAL_BUILD, ad-hoc signed)
        run: make local LOCAL_CODESIGN_IDENTITY=-

      - name: Package
        run: ditto -c -k --keepParent ~/Downloads/Yap.app Yap.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Yap
          path: Yap.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Yap.zip --title "Yap $GITHUB_REF_NAME" --notes "Ad-hoc signed build of the Yap fork of VoiceInk (GPL-3.0). Install with setup/install.sh."

      # 把 Homebrew cask 指到这个版本，各机器 brew upgrade 即可更新
      - name: Bump cask
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(shasum -a 256 Yap.zip | cut -d' ' -f1)
          git fetch origin main && git checkout main
          sed -i '' -e "s/^  version \".*\"/  version \"$VERSION\"/" -e "s/^  sha256 .*/  sha256 \"$SHA\"/" Casks/yap.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "cask: yap $VERSION" && git push origin main
