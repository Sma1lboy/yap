name: Build Yap

# 推 vX.Y.Z tag：发 Release + 更新 appcast/cask。
# 推到 main / 每周定时 / 手动：只编译，顺便把编译缓存存在 main 作用域（tag 构建只能读 main 的缓存）。
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths-ignore: ["**.md", "design/**", "appcast.xml", "Casks/**", "setup/**"]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # tag 构建：MARKETING_VERSION 取 tag；手动触发：0.0.0-dev，不发布
      # build 号 = 1000 + run_number，单调递增且大于上游的 220
      - name: Version
        run: |
          BUILD=$((1000 + GITHUB_RUN_NUMBER))
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::tag $GITHUB_REF_NAME must match vX.Y.Z"; exit 1
            fi
            VERSION="${GITHUB_REF_NAME#v}"
            RELEASE=true
          else
            VERSION="0.0.0-dev"
            RELEASE=false
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"
          echo "Yap $VERSION ($BUILD), release=$RELEASE"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      # mlx-swift 要编译 Metal shader，Xcode 26 默认不带这个组件
      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Cache whisper.cpp framework
        uses: actions/cache@v4
        with:
          path: ~/VoiceInk-Dependencies
          key: whisper-${{ runner.os }}-xcode26.6-v1

      # 自签证书：固定的 designated requirement 让 TCC 权限跨版本保留。
      # 不受信任的自签证书 codesign 找不到，所以要装进 System keychain 并信任。
      - name: Import signing certificate
        env:
          YAP_SIGNING_P12: ${{ secrets.YAP_SIGNING_P12 }}
          YAP_SIGNING_PASSWORD: ${{ secrets.YAP_SIGNING_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/yap-signing.keychain-db"
          KC_PASS=$(openssl rand -hex 16)
          echo "$YAP_SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/yap.p12"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/yap.p12" -k "$KEYCHAIN" -P "$YAP_SIGNING_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-certificate -c "Yap Self-Signed" -p "$KEYCHAIN" > "$RUNNER_TEMP/yap-cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/yap-cert.pem"
          security find-identity -v -p codesigning | tee "$RUNNER_TEMP/identities.txt"
          grep -q '"Yap Self-Signed"' "$RUNNER_TEMP/identities.txt"

      # Xcode 遇到非 Apple 签发的证书会退回 "Sign to Run Locally"（ad-hoc），
      # 所以先 ad-hoc 编译，再用自签证书整体重签；保留每个组件自己的 entitlements 和 hardened runtime
      # 本地模型相关的 Swift 包（mlx、FluidAudio、TranscribeCpp…）已经稳定，不必每次重编：
      # 缓存整个 DerivedData，依赖锁文件不变就只重编 App 自己的代码
      - name: Cache Xcode build
        uses: actions/cache@v4
        with:
          path: .local-build
          key: xcbuild-${{ runner.os }}-xcode26.6-${{ hashFiles('VoiceInk.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.run_id }}
          restore-keys: |
            xcbuild-${{ runner.os }}-xcode26.6-${{ hashFiles('VoiceInk.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-

      # SWIFT_COMPILATION_MODE=incremental：Release 默认整模块优化，改一个文件也要重编整个 App 模块；
      # 改成按文件增量编译（仍是 -O），配合缓存的 DerivedData 只重编改动的文件。
      # 但 CI 每次 checkout 都会让所有源文件的 mtime/inode 变新，Xcode 会认为全改了；
      # 所以再开 Xcode 26 的编译缓存（按内容哈希，类似 sccache），CAS 放在 .local-build 里随缓存保存
      - name: Build (LOCAL_BUILD)
        run: make local LOCAL_CLEAN=0 LOCAL_CODESIGN_IDENTITY=- EXTRA_BUILD_SETTINGS="MARKETING_VERSION=$VERSION CURRENT_PROJECT_VERSION=$BUILD SWIFT_COMPILATION_MODE=incremental COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_CAS_PATH=$GITHUB_WORKSPACE/.local-build/CompilationCache"

      - name: Re-sign with Yap Self-Signed
        run: codesign --force --deep --preserve-metadata=entitlements,runtime --sign "Yap Self-Signed" ~/Downloads/Yap.app

      - name: Verify signature
        run: |
          codesign --verify --deep --strict ~/Downloads/Yap.app
          codesign -dr - ~/Downloads/Yap.app 2>&1 | tee "$RUNNER_TEMP/requirement.txt"
          grep -qE 'certificate (leaf|root)' "$RUNNER_TEMP/requirement.txt" || { echo "::error::designated requirement is not certificate-based"; exit 1; }

      - name: Package
        run: ditto -c -k --keepParent ~/Downloads/Yap.app Yap.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Yap
          path: Yap.zip

      - name: Sparkle sign
        if: env.RELEASE == 'true'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/sparkle"
          curl -fsSL https://github.com/sparkle-project/Sparkle/releases/download/2.9.2/Sparkle-2.9.2.tar.xz | tar -xJ -C "$RUNNER_TEMP/sparkle"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$RUNNER_TEMP/ed.key"
          SIGN=$("$RUNNER_TEMP/sparkle/bin/sign_update" --ed-key-file "$RUNNER_TEMP/ed.key" Yap.zip)
          rm -f "$RUNNER_TEMP/ed.key"
          echo "$SIGN"
          echo "SPARKLE_SIGN=$SIGN" >> "$GITHUB_ENV"

      - name: Publish release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Yap.zip --title "Yap $VERSION" --notes "Self-signed (not notarized) build of Yap, a fork of VoiceInk (GPL-3.0). Install with Homebrew (brew install --cask) or setup/install.sh; existing installs update in-app via Sparkle."

      # appcast 和 Homebrew cask 同一个提交指到这个版本：app 内 Sparkle 更新，brew upgrade 也能更新
      - name: Bump appcast and cask
        if: env.RELEASE == 'true'
        run: |
          SHA=$(shasum -a 256 Yap.zip | cut -d' ' -f1)
          git fetch origin main && git checkout main
          python3 scripts/appcast.py appcast.xml "$VERSION" "$BUILD" "$SPARKLE_SIGN"
          sed -i '' -e "s/^  version \".*\"/  version \"$VERSION\"/" -e "s/^  sha256 .*/  sha256 \"$SHA\"/" Casks/yap.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml Casks/yap.rb
          git commit -m "release: yap $VERSION (appcast + cask)" && git push origin main

      - name: Clean up signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/yap-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/yap.p12" "$RUNNER_TEMP/ed.key"
