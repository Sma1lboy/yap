name: Keep build cache warm

# GitHub 会清掉 7 天没被读过的缓存；发版不一定每周都有，这里每周在 main 上读一次，
# 让 whisper.cpp 的缓存（约省 8 分钟）一直可用。key 必须和 release.yml 保持一致。
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  touch:
    runs-on: macos-26
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: ~/VoiceInk-Dependencies
          key: whisper-${{ runner.os }}-xcode26.6-v1
          lookup-only: true
